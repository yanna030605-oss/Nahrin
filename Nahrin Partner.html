document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

scrollbar-width:none\">\n      <a href=\"#how-it-works\">Как работает<\u002Fa>\n      <a href=\"#products\">Продукты<\u002Fa>\n      <a href=\"#calculator\">Расчёт<\u002Fa>\n      <a href=\"#first-month\">Первый месяц<\u002Fa>\n      <a href=\"#terms\">Условия<\u002Fa>\n    <\u002Fnav>\n    <button sc-camel-on-click=\"{{ openJoin }}\" style=\"flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:14px;border:1px solid transparent;border-radius:999px;background:#174c32;color:#f9fcf8;padding:12px 20px;min-height:44px;font-size:14px;font-weight:500;cursor:pointer;transition:transform .18s\" style-hover=\"transform:translateY(-2px)\">Стать партнёром <span>↗<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main>\n<section id=\"hero\" style=\"padding:46px 0 35px\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(20px,4vw,52px);align-items:stretch\">\n      <div style=\"padding:clamp(16px,3vw,45px) 0 24px\">\n        <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Nahrin для авторов и экспертов<\u002Fdiv>\n        <h1 style=\"font-size:clamp(38px,4.4vw,64px);max-width:760px\">Ваш контент.<br>Ваши рекомендации.<br><span style=\"color:#186b43\">Ваш результат.<\u002Fspan><\u002Fh1>\n        <p style=\"color:#52675a;font-size:18px;max-width:500px;margin-top:25px\">Превратите внимание к вашему контенту в продажи продуктов Nahrin. Партнёрство со швейцарским брендом, который работает с 1954 года.<\u002Fp>\n        <p style=\"margin:32px 0 12px;font-size:14px;font-weight:500\">С чего вы начинаете?<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1.1fr 1fr;gap:5px;background:#edf2eb;padding:5px;border:1px solid #d8e1d6;border-radius:16px;max-width:520px\">\n          <sc-for list=\"{{ routeHero }}\" as=\"o\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.3;min-height:45px;cursor:pointer;transition:background .2s;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;color:#52675a;margin-top:14px;max-width:490px\">{{ r.note }}<\u002Fp>\n        <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:28px\">\n          <a href=\"#your-route\" style=\"display:inline-flex;align-items:center;gap:20px;border-radius:999px;background:#174c32;color:#f9fcf8;padding:15px 24px;min-height:50px;font-weight:500;line-height:1.2;transition:transform .18s\" style-hover=\"transform:translateY(-2px);color:#f9fcf8\">Посмотреть мой сценарий <span>↗<\u002Fspan><\u002Fa>\n          <a href=\"#calculator\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 8px;font-weight:500\">Рассчитать результат<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figure style=\"margin:0;min-height:clamp(335px,45vw,585px);border-radius:160px 160px 24px 24px;overflow:hidden;position:relative;background:#edf2eb\">\n        <img src=\"12591c0b-be89-45f7-a358-6d5725d548af\" alt=\"Альпийский пейзаж из материалов Nahrin\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n        <figcaption style=\"position:absolute;left:0;right:0;bottom:0;padding:32px 30px 25px;background:linear-gradient(transparent,rgba(10,30,18,.75));color:#f5f9f4;font-size:14px\">Швейцарский бренд. Более 70 лет истории.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n    <div style=\"padding:30px 0 5px;display:flex;justify-content:space-between;align-items:center;gap:20px 30px;flex-wrap:wrap;color:#52675a;font-size:14px\">\n      <div style=\"display:flex;gap:12px;align-items:center\"><strong style=\"color:#17392a;font-size:18px;font-weight:500\">1954<\u002Fstrong><span>год основания<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;align-items:center\"><strong style=\"color:#17392a;font-size:18px;font-weight:500\">FSSC 22000<\u002Fstrong><span>пищевая безопасность<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;align-items:center\"><strong style=\"color:#17392a;font-size:18px;font-weight:500\">2 формата<\u002Fstrong><span>партнёрских продаж<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"your-route\" style=\"padding:65px 0;border-bottom:1px solid #d8e1d6\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(35px,6vw,80px);align-items:start\">\n    <div>\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">{{ r.eyebrow }}<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px);max-width:780px\">{{ r.t1 }}<br>{{ r.t2 }}<\u002Fh2>\n      <p style=\"margin-top:24px;color:#52675a;font-size:20px;line-height:1.5;max-width:580px\">{{ r.intro }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:25px\">\n      <sc-for list=\"{{ r.roles }}\" as=\"role\" hint-placeholder-count=\"3\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,max-content) minmax(0,1fr));grid-template-columns:120px minmax(0,1fr);gap:24px\">\n          <strong style=\"font-weight:500\">{{ role.h }}<\u002Fstrong>\n          <p style=\"color:#52675a;margin:0;font-size:15px\">{{ role.p }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <a href=\"#sales-mode\" style=\"display:inline-flex;align-items:center;gap:12px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px;width:fit-content\">Выбрать способ продаж <span>→<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"sales-mode\" style=\"padding:clamp(65px,8vw,94px) 0\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"margin-bottom:40px\">\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Формат партнёрства<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px);max-width:780px\">Выберите, как вам<br>удобнее продавать.<\u002Fh2>\n      <p style=\"margin-top:22px;max-width:620px;color:#52675a;font-size:18px\">Оба формата доступны для любого сценария старта. Различаются ваши действия и способ расчёта результата.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:22px\">\n      <article style=\"padding:{{ mc.link.pad }};border:{{ mc.link.border }};border-radius:20px;background:#fff;display:flex;flex-direction:column\">\n        <div style=\"display:flex;justify-content:space-between;gap:20px;align-items:start\">\n          <h3 style=\"font-size:27px;letter-spacing:-.025em\">По персональной ссылке<\u002Fh3>\n          <span style=\"width:25px;height:25px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;border:1px solid {{ mc.link.markBorder }};background:{{ mc.link.markBg }};color:#f9fcf8\">{{ mc.link.mark }}<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin-top:20px;color:#52675a;max-width:450px\">Вы рекомендуете. Покупатель оформляет заказ на сайте, компания принимает оплату и отправляет товар.<\u002Fp>\n        <div style=\"margin-top:14px;font-size:48px;letter-spacing:-.05em;line-height:1.05\">10,5%<span style=\"display:block;font-size:15px;letter-spacing:0;color:#52675a;margin-top:8px\">интернет-бонус по опубликованным условиям<\u002Fspan><\u002Fdiv>\n        <div style=\"margin:28px 0;display:grid;gap:9px;font-size:15px\">\n          <div><span style=\"color:#186b43;margin-right:10px\">✓<\u002Fspan>Контент и трафик на вашей стороне<\u002Fdiv>\n          <div><span style=\"color:#186b43;margin-right:10px\">✓<\u002Fspan>Заказ и отправка на стороне компании<\u002Fdiv>\n          <div><span style=\"color:#186b43;margin-right:10px\">✓<\u002Fspan>Вознаграждение от учитываемых покупок<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ pickLink }}\" style=\"align-self:flex-start;margin-top:auto;display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:15px 24px;min-height:50px;font-weight:500;cursor:pointer;transition:transform .18s;background:{{ mc.link.btnBg }};color:{{ mc.link.btnFg }};border:1px solid {{ mc.link.btnBorder }}\" style-hover=\"transform:translateY(-2px)\">{{ mc.link.btn }}<\u002Fbutton>\n      <\u002Farticle>\n      <article style=\"padding:{{ mc.retail.pad }};border:{{ mc.retail.border }};border-radius:20px;background:#fff;display:flex;flex-direction:column\">\n        <div style=\"display:flex;justify-content:space-between;gap:20px;align-items:start\">\n          <h3 style=\"font-size:27px;letter-spacing:-.025em\">Своим клиентам<\u002Fh3>\n          <span style=\"width:25px;height:25px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;border:1px solid {{ mc.retail.markBorder }};background:{{ mc.retail.markBg }};color:#f9fcf8\">{{ mc.retail.mark }}<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin-top:20px;color:#52675a;max-width:450px\">Вы закупаете продукцию по партнёрской цене, продаёте своим клиентам и организуете передачу товара.<\u002Fp>\n        <div style=\"margin-top:14px;font-size:48px;letter-spacing:-.05em;line-height:1.05\">30%<span style=\"display:block;font-size:15px;letter-spacing:0;color:#52675a;margin-top:8px\">скидка от розничной цены при закупке<\u002Fspan><\u002Fdiv>\n        <div style=\"margin:28px 0;display:grid;gap:9px;font-size:15px\">\n          <div><span style=\"color:#186b43;margin-right:10px\">✓<\u002Fspan>Подбор и закупка продукции<\u002Fdiv>\n          <div><span style=\"color:#186b43;margin-right:10px\">✓<\u002Fspan>Продажа и работа с клиентом<\u002Fdiv>\n          <div><span style=\"color:#186b43;margin-right:10px\">✓<\u002Fspan>Разница между продажей и закупкой<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ pickRetail }}\" style=\"align-self:flex-start;margin-top:auto;display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:15px 24px;min-height:50px;font-weight:500;cursor:pointer;transition:transform .18s;background:{{ mc.retail.btnBg }};color:{{ mc.retail.btnFg }};border:1px solid {{ mc.retail.btnBorder }}\" style-hover=\"transform:translateY(-2px)\">{{ mc.retail.btn }}<\u002Fbutton>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <p style=\"font-size:14px;color:#52675a;margin-top:18px;max-width:850px\">Базовые способы расчёта не складываются по одному заказу. Состав учитываемых покупок, дополнительные премии и выплаты определяются условиями программы. <a href=\"#terms\" style=\"text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6\">Подробнее об условиях<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how-it-works\" style=\"padding:clamp(65px,8vw,94px) 0;background:#edf2eb\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"margin-bottom:40px\">\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Понятный путь продажи<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px);max-width:780px\">{{ proc.t1 }}<br>{{ proc.t2 }}<\u002Fh2>\n      <p style=\"margin-top:22px;max-width:620px;color:#52675a;font-size:18px\">{{ proc.intro }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:32px\">\n      <sc-for list=\"{{ proc.steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n        <div style=\"position:relative;padding-top:22px;border-top:2px solid #d8e1d6\" style-before=\"content:'';position:absolute;top:-5px;left:0;width:8px;height:8px;background:#186b43;border-radius:50%\">\n          <h3 style=\"font-size:23px;letter-spacing:-.025em;margin-bottom:14px\">{{ st.h }}<\u002Fh3>\n          <p style=\"font-size:15px;color:#52675a\">{{ st.p }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin-top:25px;font-size:14px;line-height:1.5;color:#52675a\">{{ proc.note }}<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"content-system\" style=\"padding:clamp(65px,8vw,94px) 0\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"border-radius:24px;padding:clamp(25px,4vw,48px);background:#edf2eb\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(35px,6vw,80px);align-items:start\">\n        <div>\n          <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Контент, который ведёт к покупке<\u002Fdiv>\n          <h2 style=\"font-size:clamp(32px,3vw,40px)\">{{ r.s1 }}<br>{{ r.s2 }}<\u002Fh2>\n          <p style=\"color:#52675a;margin-top:24px\">{{ r.systemIntro }}<\u002Fp>\n          <a href=\"#content-examples\" style=\"display:inline-flex;align-items:center;gap:12px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px\">Посмотреть пример контента <span>→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:16px\">\n          <div style=\"display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px;padding-bottom:18px;border-bottom:1px solid #d8e1d6\"><strong style=\"font-size:14px;font-weight:600\">Идея<\u002Fstrong><p style=\"margin:0;font-size:15px;color:#52675a\">Возьмите реальный вопрос аудитории и факт из продуктовых материалов.<\u002Fp><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px;padding-bottom:18px;border-bottom:1px solid #d8e1d6\"><strong style=\"font-size:14px;font-weight:600\">Материал<\u002Fstrong><p style=\"margin:0;font-size:15px;color:#52675a\">Сделайте обзор, карусель, предметное видео или озвученный разбор.<\u002Fp><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px;padding-bottom:18px;border-bottom:1px solid #d8e1d6\"><strong style=\"font-size:14px;font-weight:600\">ИИ<\u002Fstrong><p style=\"margin:0;font-size:15px;color:#52675a\">Используйте его для черновика, монтажа и адаптаций. Факты и итоговый текст проверяйте сами.<\u002Fp><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px\"><strong style=\"font-size:14px;font-weight:600\">Проверка<\u002Fstrong><p style=\"margin:0;font-size:15px;color:#52675a\">Смотрите на переходы и заказы. Повторяйте подходы, которые дают результат.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isStarter }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:20px 0 0;font-size:14px;line-height:1.5;color:#52675a\">Показывать лицо необязательно: можно снимать продукт и руки, делать карусели и озвученные материалы. Создание аудитории требует времени и регулярной работы.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"brand\" style=\"padding:clamp(65px,8vw,94px) 0\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(35px,6vw,80px);align-items:start\">\n    <div>\n      <img src=\"3afaa9df-460c-4870-bef1-bf585346d01d\" alt=\"Производственный комплекс Nahrin в Швейцарии\" style=\"width:100%;aspect-ratio:1.15;object-fit:cover;border-radius:24px\">\n      <p style=\"margin-top:15px;font-size:14px;line-height:1.5;color:#52675a\">Производственная площадка Nahrin в Швейцарии.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding-top:12px\">\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Основания для вашей рекомендации<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px)\">За продуктом<br>стоит история.<\u002Fh2>\n      <div style=\"font-size:clamp(82px,8vw,100px);line-height:1;letter-spacing:-.075em;margin:25px 0 8px\">1954<\u002Fdiv>\n      <p style=\"font-size:16px;color:#52675a\">Год основания Nahrin в Швейцарии<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px;margin-top:30px\">\n        <div><strong style=\"display:block;font-size:23px;font-weight:500;margin-bottom:10px\">Своя экспертиза<\u002Fstrong><p style=\"font-size:14px;color:#52675a\">Разработка продуктов, внимание к сырью и многолетний опыт пищевого производства.<\u002Fp><\u002Fdiv>\n        <div><strong style=\"display:block;font-size:23px;font-weight:500;margin-bottom:10px\">FSSC 22000<\u002Fstrong><p style=\"font-size:14px;color:#52675a\">Система управления безопасностью пищевой продукции. Не сертификат лечебного действия.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:12px 24px;flex-wrap:wrap;margin-top:28px\">\n        <a href=\"https://www.nahrin.com/en/about-us\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px\">История бренда ↗<\u002Fa>\n        <a href=\"https://www.nahrin.ch/de/allgemein/haeufige-fragen\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px\">О стандарте ↗<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin-top:18px;font-size:12px;color:#52675a\">Страну производства конкретного продукта проверяйте по маркировке. Часть косметической линейки производится в Италии.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"retail\" style=\"padding:32px 0 84px\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(24px,5vw,68px);align-items:start\">\n      <div>\n        <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Международное присутствие<\u002Fdiv>\n        <h2 style=\"font-size:clamp(36px,3.6vw,52px)\">Европа. Азия.<br>Россия и СНГ.<\u002Fh2>\n        <div style=\"margin-top:27px;display:flex\"><span style=\"font-size:13px;color:#52675a;border-bottom:1px solid #d8e1d6;padding-bottom:6px\">Международный бренд Nahrin<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:clamp(20px,1.8vw,22px);line-height:1.5;margin-bottom:22px;max-width:650px\">Наш бренд является международным и продаётся в Европе, Азии, России и СНГ.<\u002Fp>\n        <p style=\"font-size:17px;line-height:1.7;color:#52675a;max-width:650px;margin:0\">В России и СНГ мы представлены в аптечных сетях среднего и премиального сегмента, среди которых «36,6», «Доктор Столетов», «Неофарм» и «Самсон-Фарма»; в ритейле, включая ЦУМ и «Золотое яблоко»; в премиальных клиниках и аптеках при них, включая МЕДСИ, а также на маркетплейсах и различных онлайн-ресурсах.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:42px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px\">\n        <p style=\"margin:0;font-size:15px;font-weight:500\">Аптеки, ритейл и клиники<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <span style=\"font-size:13px;color:#52675a;margin-right:12px;white-space:nowrap;font-variant-numeric:tabular-nums\">{{ retailPos }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ retailPrev }}\" aria-label=\"Предыдущие логотипы\" style=\"width:44px;height:44px;border:1px solid #d8e1d6;border-radius:50%;background:#fff;font-size:22px;cursor:pointer;opacity:{{ prevOp }}\" style-hover=\"background:#dbeacb\">←<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ retailNext }}\" aria-label=\"Следующие логотипы\" style=\"width:44px;height:44px;border:1px solid #d8e1d6;border-radius:50%;background:#fff;font-size:22px;cursor:pointer;opacity:{{ nextOp }}\" style-hover=\"background:#dbeacb\">→<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div ref=\"{{ trackRef }}\" sc-camel-on-scroll=\"{{ onTrackScroll }}\" tabindex=\"0\" sc-camel-on-key-down=\"{{ onTrackKey }}\" style=\"display:grid;grid-auto-flow:column;grid-auto-columns:max(210px,calc((100% - 54px) / 4));gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;padding:6px 0 9px\">\n        <sc-for list=\"{{ retail }}\" as=\"rt\" hint-placeholder-count=\"4\">\n          <a href=\"{{ rt.url }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0;border:1px solid #d8e1d6;border-radius:18px;padding:23px 20px 19px;background:#fff;gap:22px;transition:border-color .2s\" style-hover=\"border-color:#186b43\">\n            <div style=\"height:100px;width:100%;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;padding:10px\"><img src=\"{{ rt.img }}\" alt=\"{{ rt.name }}\" style=\"width:100%;height:78px;object-fit:contain\"><\u002Fdiv>\n            <span style=\"text-align:center;font-size:12px;color:#52675a;line-height:1.4\">{{ rt.kind }}<\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size:12px;color:#52675a;margin:14px 0 0\">Листайте логотипы стрелками или жестом на трекпаде.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"experts\" style=\"padding:clamp(65px,8vw,94px) 0;background:#edf2eb\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(40px,7vw,90px)\">\n    <div>\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Сначала уверенность в продукте<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.2vw,42px)\">Рекомендация,<br>в которой есть<br>содержание.<\u002Fh2>\n      <p style=\"color:#52675a;margin-top:22px\">У вас должны быть ответы на вопросы о составе, происхождении и применении продукта. Опирайтесь на конкретные материалы и проверяемые источники.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"border-bottom:1px solid #d8e1d6\">\n        <button sc-camel-on-click=\"{{ tog.docs }}\" style=\"width:100%;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:19px;padding:24px 0;font-weight:500;text-align:left\">Продуктовые документы<span style=\"font-size:26px;font-weight:400\">{{ sign.docs }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ acc.docs }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#52675a;padding:0 28px 25px 0;font-size:15px\">Начните с состава, маркировки, инструкции и ограничений конкретного продукта. Для БАД проверяйте сведения о регистрации, для косметики и пищевых продуктов соответствующие документы.<br><a href=\"#products\" style=\"display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px;color:#17392a\">Выбрать продукт →<\u002Fa><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #d8e1d6\">\n        <button sc-camel-on-click=\"{{ tog.research }}\" style=\"width:100%;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:19px;padding:24px 0;font-weight:500;text-align:left\">Исследования продукции Nahrin<span style=\"font-size:26px;font-weight:400\">{{ sign.research }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ acc.research }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"color:#52675a;padding:0 28px 25px 0;font-size:15px\">Для продуктов Nahrin представлены лабораторные исследования по технологии «Литос-система», разработанной академиком РАН, доктором медицинских наук, профессором В. Н. Шабалиным и доктором медицинских наук, профессором С. Н. Шатохиной.<p style=\"margin-top:16px;margin-bottom:8px\">В материалах рассмотрены коэнзим Q10, Осартен, Артишок и другие продукты. Доступны полный протокол и отдельное дополнение по Q10 и Осартену.<\u002Fp><button sc-camel-on-click=\"{{ info.research }}\" style=\"background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px;color:#17392a;font-weight:500\">Посмотреть исследования →<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #d8e1d6\">\n        <button sc-camel-on-click=\"{{ tog.doctors }}\" style=\"width:100%;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:19px;padding:24px 0;font-weight:500;text-align:left\">Врачи и медицинские центры<span style=\"font-size:26px;font-weight:400\">{{ sign.doctors }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ acc.doctors }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#52675a;padding:0 28px 25px 0;font-size:15px\">У Nahrin есть профессиональные материалы, работа с врачами и выступления на конференциях. Изучайте автора, тему и основания его выводов. Участие специалиста в выступлении не означает рекомендацию всей линейки медицинским сообществом.<br><a href=\"https://swissnahrinrus.ru/testimonials?page=1\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px;color:#17392a\">Материалы специалистов ↗<\u002Fa><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid #d8e1d6\">\n        <button sc-camel-on-click=\"{{ tog.reviews }}\" style=\"width:100%;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:19px;padding:24px 0;font-weight:500;text-align:left\">Опыт покупателей<span style=\"font-size:26px;font-weight:400\">{{ sign.reviews }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ acc.reviews }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#52675a;padding:0 28px 25px 0;font-size:15px\">Отзывы помогают узнать о вкусе, текстуре, упаковке и удобстве. На Ozon и других площадках проверяйте конкретную карточку товара, продавца и разные оценки. Личный опыт покупателя не заменяет исследование.<br><button sc-camel-on-click=\"{{ info.reviews }}\" style=\"background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px;color:#17392a;font-weight:500\">На что смотреть в отзывах →<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"products\" style=\"padding:clamp(65px,8vw,94px) 0\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"margin-bottom:40px\">\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">С чего начать знакомство<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px);max-width:780px\">Найдите продукт,<br>близкий вашей аудитории.<\u002Fh2>\n      <p style=\"margin-top:22px;max-width:620px;color:#52675a;font-size:18px\">Состав, сценарий использования и формат контента важнее длинного каталога. Начните с одной подходящей позиции.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:28px 18px\">\n      <sc-for list=\"{{ products }}\" as=\"pr\" hint-placeholder-count=\"4\">\n        <article style=\"display:flex;flex-direction:column;min-width:0\">\n          <div style=\"background:#fff;border-radius:20px;aspect-ratio:.92;display:grid;place-items:center;overflow:hidden\"><img src=\"{{ pr.img }}\" alt=\"{{ pr.alt }}\" style=\"width:85%;height:85%;object-fit:contain;transition:transform .35s\" style-hover=\"transform:scale(1.04)\"><\u002Fdiv>\n          <div style=\"font-size:12px;color:#52675a;margin:19px 0 10px\">{{ pr.cat }}<\u002Fdiv>\n          <h3 style=\"font-size:clamp(20px,1.8vw,23px);letter-spacing:-.025em;line-height:1.15;min-height:53px\">{{ pr.h1 }}<br>{{ pr.h2 }}<\u002Fh3>\n          <p style=\"font-size:14px;color:#52675a;margin:13px 0 20px\">{{ pr.text }}<\u002Fp>\n          <button sc-camel-on-click=\"{{ pr.open }}\" style=\"margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:13px 20px;min-height:48px;font-weight:500;cursor:pointer;background:transparent;color:#17392a;border:1px solid #d8e1d6;transition:transform .18s\" style-hover=\"transform:translateY(-2px);border-color:#186b43\">Изучить продукт ↗<\u002Fbutton>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:30px;border:1px solid #d8e1d6;padding:24px 26px;border-radius:16px;font-size:clamp(17px,1.5vw,19px);letter-spacing:.01em;color:#52675a\">БАД. Не является лекарственным средством. Перед применением ознакомьтесь с инструкцией и противопоказаниями.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"content-examples\" style=\"padding:clamp(65px,8vw,94px) 0;background:#edf2eb\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"margin-bottom:40px\">\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Один продукт. Разные форматы.<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px);max-width:780px\">Рекомендация начинается<br>с хорошей идеи.<\u002Fh2>\n      <p style=\"margin-top:22px;max-width:620px;color:#52675a;font-size:18px\">Примеры сценариев для своей подачи. Они показывают подход к контенту и не являются кейсами заработка.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:5px;background:#edf2eb;padding:5px;border:1px solid #d8e1d6;border-radius:16px;width:fit-content;max-width:100%;margin-bottom:24px\">\n      <sc-for list=\"{{ exampleSeg }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;border-radius:11px;padding:12px 18px;font-size:14px;line-height:1.3;min-height:45px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(20px,4vw,50px)\">\n      <div style=\"padding:10px 0\">\n        <h3 style=\"font-size:32px;letter-spacing:-.025em;margin-bottom:18px\">{{ ex.title }}<\u002Fh3>\n        <p style=\"color:#52675a\">{{ ex.description }}<\u002Fp>\n        <span style=\"font-size:14px;line-height:1.5;color:#52675a\">Можно адаптировать под короткое видео, пост или карусель.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #d8e1d6;border-radius:20px;padding:clamp(24px,3vw,32px);display:grid;gap:20px\">\n        <sc-for list=\"{{ ex.lines }}\" as=\"ln\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,max-content));grid-template-columns:115px minmax(0,1fr);gap:24px\">\n            <small style=\"color:#52675a;font-size:13px\">{{ ln.h }}<\u002Fsmall>\n            <p style=\"font-size:17px;margin:0\">{{ ln.p }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"support\" style=\"padding:clamp(65px,8vw,94px) 0\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(40px,7vw,90px)\">\n    <div>\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Основа для первых действий<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px)\">Разобраться.<br>Подготовиться.<br>Попробовать.<\u002Fh2>\n      <p style=\"margin-top:25px;color:#52675a;font-size:20px;line-height:1.5;max-width:580px\">В программе есть продуктовое обучение и академия Nahrin. Начните с материалов бренда и понятного рабочего плана.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:28px\">\n        <button sc-camel-on-click=\"{{ info.starterKit }}\" style=\"display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:15px 24px;min-height:50px;font-weight:500;cursor:pointer;background:transparent;color:#17392a;border:1px solid #d8e1d6;transition:transform .18s\" style-hover=\"transform:translateY(-2px);border-color:#186b43\">Открыть план подготовки ↗<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin-top:18px;font-size:12px;color:#52675a\">Актуальные занятия, доступ к материалам и формат поддержки уточняются при подключении.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px;align-content:start\">\n      <div><h3 style=\"font-size:21px;letter-spacing:-.025em;margin-bottom:12px\">Знание продукта<\u002Fh3><p style=\"color:#52675a;font-size:15px\">Состав, инструкция, ограничения и источники для корректного рассказа.<\u002Fp><\u002Fdiv>\n      <div><h3 style=\"font-size:21px;letter-spacing:-.025em;margin-bottom:12px\">Контент-план<\u002Fh3><p style=\"color:#52675a;font-size:15px\">Тема, вопросы аудитории, серия публикаций и понятный следующий шаг.<\u002Fp><\u002Fdiv>\n      <div><h3 style=\"font-size:21px;letter-spacing:-.025em;margin-bottom:12px\">Работа с ИИ<\u002Fh3><p style=\"color:#52675a;font-size:15px\">Черновики, адаптации и монтаж с обязательной проверкой фактов человеком.<\u002Fp><\u002Fdiv>\n      <div><h3 style=\"font-size:21px;letter-spacing:-.025em;margin-bottom:12px\">Анализ результата<\u002Fh3><p style=\"color:#52675a;font-size:15px\">Переходы, заказы, расходы и решение о следующем тесте.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"earnings\" style=\"padding:0 0 clamp(65px,8vw,94px)\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(35px,6vw,80px);align-items:start\">\n    <div>\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Экономика выбранного формата<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px)\">Одна покупка.<br>Понятный расчёт.<\u002Fh2>\n      <p style=\"margin-top:23px;color:#52675a\">{{ earnCopy }}<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <sc-if value=\"{{ isLink }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:center;gap:17px 22px;flex-wrap:wrap;padding:32px 0\">\n          <div style=\"font-size:clamp(31px,3vw,40px);letter-spacing:-.04em;line-height:1.15\">5 000 ₽<small style=\"display:block;font-size:13px;letter-spacing:0;color:#52675a;margin-top:7px\">база покупки<\u002Fsmall><\u002Fdiv>\n          <span style=\"font-size:24px;color:#52675a\">×<\u002Fspan>\n          <div style=\"font-size:clamp(31px,3vw,40px);letter-spacing:-.04em;line-height:1.15\">10,5%<small style=\"display:block;font-size:13px;letter-spacing:0;color:#52675a;margin-top:7px\">интернет-бонус<\u002Fsmall><\u002Fdiv>\n          <span style=\"font-size:24px;color:#52675a\">=<\u002Fspan>\n          <div style=\"font-size:clamp(31px,3vw,40px);letter-spacing:-.04em;line-height:1.15;color:#186b43\">525 ₽<small style=\"display:block;font-size:13px;letter-spacing:0;color:#52675a;margin-top:7px\">до расходов и налогов<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isRetail }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:17px 22px;flex-wrap:wrap;padding:32px 0\">\n          <div style=\"font-size:clamp(31px,3vw,40px);letter-spacing:-.04em;line-height:1.15\">5 000 ₽<small style=\"display:block;font-size:13px;letter-spacing:0;color:#52675a;margin-top:7px\">розничная продажа<\u002Fsmall><\u002Fdiv>\n          <span style=\"font-size:24px;color:#52675a\">−<\u002Fspan>\n          <div style=\"font-size:clamp(31px,3vw,40px);letter-spacing:-.04em;line-height:1.15\">3 500 ₽<small style=\"display:block;font-size:13px;letter-spacing:0;color:#52675a;margin-top:7px\">закупочная стоимость<\u002Fsmall><\u002Fdiv>\n          <span style=\"font-size:24px;color:#52675a\">=<\u002Fspan>\n          <div style=\"font-size:clamp(31px,3vw,40px);letter-spacing:-.04em;line-height:1.15;color:#186b43\">1 500 ₽<small style=\"display:block;font-size:13px;letter-spacing:0;color:#52675a;margin-top:7px\">разница до расходов<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <p style=\"font-size:14px;line-height:1.5;color:#52675a\">{{ earnFoot }}<\u002Fp>\n      <a href=\"#calculator\" style=\"display:inline-flex;align-items:center;gap:12px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px\">Рассчитать со своими данными →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"calculator\" style=\"padding:clamp(65px,8vw,94px) 0;background:#edf2eb\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"margin-bottom:40px\">\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Ваша модель в цифрах<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px);max-width:780px\">Посмотрите, что стоит<br>за вашей целью.<\u002Fh2>\n      <p style=\"margin-top:22px;max-width:620px;color:#52675a;font-size:18px\">Задайте свои данные или изучите пример. Расчёт связывает контент, покупки и результат до и после указанных расходов.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #d8e1d6;background:#fff;border-radius:24px;overflow:hidden\">\n      <div style=\"padding:clamp(16px,2.5vw,28px) clamp(16px,2.5vw,32px);display:flex;align-items:center;justify-content:space-between;gap:12px 20px;border-bottom:1px solid #d8e1d6;flex-wrap:wrap\">\n        <div style=\"display:flex;gap:5px;background:#f7f9f6;padding:5px;border:1px solid #d8e1d6;border-radius:16px\">\n          <sc-for list=\"{{ calcSeg }}\" as=\"o\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;border-radius:11px;padding:12px 18px;font-size:14px;line-height:1.3;min-height:45px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:5px;background:#f7f9f6;padding:5px;border:1px solid #d8e1d6;border-radius:16px\">\n          <sc-for list=\"{{ modeSeg }}\" as=\"o\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;border-radius:11px;padding:12px 18px;font-size:14px;line-height:1.3;min-height:45px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))\">\n        <div style=\"padding:clamp(22px,3vw,34px)\">\n          <div style=\"display:flex;gap:5px;background:#edf2eb;padding:5px;border:1px solid #d8e1d6;border-radius:16px;width:fit-content;margin-bottom:24px\">\n            <sc-for list=\"{{ routeShort }}\" as=\"o\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;border-radius:11px;padding:12px 18px;font-size:14px;line-height:1.3;min-height:45px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isForward }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid #d8e1d6\">\n              <h3 style=\"font-size:17px;letter-spacing:0;margin-bottom:19px\">Ваш контент за месяц<\u002Fh3>\n              <sc-if value=\"{{ isAudience }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:20px\">\n                  <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Размер аудитории<\u002Fspan><input type=\"number\" min=\"0\" max=\"100000000\" step=\"100\" value=\"{{ inp.followers }}\" sc-camel-on-change=\"{{ on.followers }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Охват публикации, %<\u002Fspan><input type=\"number\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ inp.reach }}\" sc-camel-on-change=\"{{ on.reach }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Публикаций за месяц<\u002Fspan><input type=\"number\" min=\"0\" max=\"10000\" step=\"1\" value=\"{{ inp.audiencePosts }}\" sc-camel-on-change=\"{{ on.audiencePosts }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">Материалы, которые ведут к покупке.<\u002Fsmall><\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ isStarter }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:20px\">\n                  <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Число аккаунтов<\u002Fspan><input type=\"number\" min=\"0\" max=\"1000\" step=\"1\" value=\"{{ inp.accounts }}\" sc-camel-on-change=\"{{ on.accounts }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Публикаций на аккаунт<\u002Fspan><input type=\"number\" min=\"0\" max=\"10000\" step=\"1\" value=\"{{ inp.starterPosts }}\" sc-camel-on-change=\"{{ on.starterPosts }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">За расчётный месяц.<\u002Fsmall><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Просмотров публикации<\u002Fspan><input type=\"number\" min=\"0\" max=\"100000000\" step=\"100\" value=\"{{ inp.postViews }}\" sc-camel-on-change=\"{{ on.postViews }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">В том же месяце, а не за всё время.<\u002Fsmall><\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isReverse }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid #d8e1d6\">\n              <h3 style=\"font-size:17px;letter-spacing:0;margin-bottom:19px\">Какая сумма является вашей целью?<\u002Fh3>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:20px\">\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Цель за месяц, ₽<\u002Fspan><input type=\"number\" min=\"0\" max=\"100000000\" step=\"1000\" value=\"{{ inp.goal }}\" sc-camel-on-change=\"{{ on.goal }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Как считать цель<\u002Fspan><sc-raw-select value=\"{{ inp.goalKind }}\" sc-camel-on-change=\"{{ on.goalKind }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;min-width:0\"><option value=\"gross\">До расходов<\u002Foption><option value=\"net\">После расходов<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px\">\n                <sc-for list=\"{{ goalSeg }}\" as=\"g\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ g.pick }}\" style=\"border-radius:9px;padding:8px 12px;min-height:40px;font-size:13px;cursor:pointer;background:{{ g.bg }};border:1px solid {{ g.border }}\">{{ g.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Просмотров одной публикации<\u002Fspan><input type=\"number\" min=\"0\" max=\"100000000\" step=\"100\" value=\"{{ inp.reverseViews }}\" sc-camel-on-change=\"{{ on.reverseViews }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">За выбранный месяц. На этой основе считаем объём контента.<\u002Fsmall><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid #d8e1d6\">\n            <h3 style=\"font-size:17px;letter-spacing:0;margin-bottom:19px\">Переходы и покупки<\u002Fh3>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:20px\">\n              <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Доля переходов, %<\u002Fspan><input type=\"number\" min=\"0\" max=\"100\" step=\"0.1\" value=\"{{ inp.ctr }}\" sc-camel-on-change=\"{{ on.ctr }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">Из просмотров в магазин.<\u002Fsmall><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Конверсия в заказ, %<\u002Fspan><input type=\"number\" min=\"0\" max=\"100\" step=\"0.1\" value=\"{{ inp.conversion }}\" sc-camel-on-change=\"{{ on.conversion }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">Из переходов в созданный заказ.<\u002Fsmall><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">{{ priceLabel }}<\u002Fspan><input type=\"number\" min=\"0\" max=\"10000000\" step=\"100\" value=\"{{ inp.price }}\" sc-camel-on-change=\"{{ on.price }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">{{ priceHelp }}<\u002Fsmall><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Учитываемые заказы, %<\u002Fspan><input type=\"number\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ inp.accounted }}\" sc-camel-on-change=\"{{ on.accounted }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">После оплаты и корректировок.<\u002Fsmall><\u002Flabel>\n              <sc-if value=\"{{ isRetail }}\" hint-placeholder-val=\"{{ false }}\">\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Скидка клиенту, %<\u002Fspan><input type=\"number\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ inp.clientDiscount }}\" sc-camel-on-change=\"{{ on.clientDiscount }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">Снижает выручку; закупка остаётся 70% розничной цены.<\u002Fsmall><\u002Flabel>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <button sc-camel-on-click=\"{{ toggleExp }}\" style=\"width:100%;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:14px;padding:12px 0;font-weight:500;text-align:left\">Добавить расходы и налоги<span style=\"font-size:26px;font-weight:400\">{{ expSign }}<\u002Fspan><\u002Fbutton>\n            <sc-if value=\"{{ expOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:20px\">\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Прочие расходы, ₽<\u002Fspan><input type=\"number\" min=\"0\" max=\"100000000\" step=\"100\" value=\"{{ inp.expenses }}\" sc-camel-on-change=\"{{ on.expenses }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">Контент, сервисы, реклама, доставка. Без себестоимости уже учтённых продаж.<\u002Fsmall><\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Налоги, ₽<\u002Fspan><input type=\"number\" min=\"0\" max=\"100000000\" step=\"100\" value=\"{{ inp.taxes }}\" sc-camel-on-change=\"{{ on.taxes }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:18px;font-variant-numeric:tabular-nums;min-width:0\"><small style=\"font-size:12px;line-height:1.4;color:#52675a\">Введите сумму для вашего оформления. Ставка не назначается автоматически.<\u002Fsmall><\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isReverse }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding-top:24px;margin-top:24px;border-top:1px solid #d8e1d6\">\n              <h3 style=\"font-size:19px;letter-spacing:-.015em;margin-bottom:18px\">Сопоставьте цель с вашим временем<\u002Fh3>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px\">\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Часов в день<\u002Fspan><input type=\"number\" min=\"0\" max=\"24\" step=\"0.5\" value=\"{{ inp.hoursDay }}\" sc-camel-on-change=\"{{ on.hoursDay }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:16px;min-width:0\"><\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Дней в месяце<\u002Fspan><input type=\"number\" min=\"0\" max=\"31\" step=\"1\" value=\"{{ inp.workDays }}\" sc-camel-on-change=\"{{ on.workDays }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:16px;min-width:0\"><\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Минут на материал<\u002Fspan><input type=\"number\" min=\"0\" max=\"10000\" step=\"5\" value=\"{{ inp.minutesPost }}\" sc-camel-on-change=\"{{ on.minutesPost }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:16px;min-width:0\"><\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Прочие часы<\u002Fspan><input type=\"number\" min=\"0\" max=\"744\" step=\"1\" value=\"{{ inp.otherHours }}\" sc-camel-on-change=\"{{ on.otherHours }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:16px;min-width:0\"><\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Аккаунтов в плане<\u002Fspan><input type=\"number\" min=\"1\" max=\"1000\" step=\"1\" value=\"{{ inp.targetAccounts }}\" sc-camel-on-change=\"{{ on.targetAccounts }}\" style=\"background:#f7f9f6;border:1px solid #d8e1d6;border-radius:12px;width:100%;height:49px;padding:10px 13px;font-size:16px;min-width:0\"><\u002Flabel>\n              <\u002Fdiv>\n              <p style=\"font-size:14px;margin:16px 0 0;color:#52675a\">Обучение, аналитика и администрирование входят в прочие часы.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"padding:clamp(22px,3vw,36px);background:#edf2eb;border-left:1px solid #d8e1d6;display:flex;flex-direction:column;min-width:0\">\n          <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">{{ res.eyebrow }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:#52675a\">{{ res.label }}<\u002Fdiv>\n          <div style=\"font-size:clamp(40px,4.5vw,65px);line-height:1.15;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:14px 0 8px;overflow-wrap:anywhere\">{{ res.main }}<\u002Fdiv>\n          <p style=\"font-size:14px;color:#52675a;max-width:390px\">{{ res.expl }}<\u002Fp>\n          <sc-if value=\"{{ res.hasError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #d8e1d6;padding:14px 18px;border-radius:12px;font-size:14px\">{{ res.error }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0\">\n            <sc-for list=\"{{ res.flow }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div><strong style=\"font-size:26px;font-weight:500;display:block;line-height:1.2;font-variant-numeric:tabular-nums\">{{ f.v }}<\u002Fstrong><span style=\"font-size:12px;color:#52675a\">{{ f.l }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin:0 0 24px;display:grid;gap:15px\">\n            <sc-for list=\"{{ res.rows }}\" as=\"rw\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;font-size:14px;border-top:{{ rw.bt }};padding-top:{{ rw.pt }}\"><span>{{ rw.label }}<\u002Fspan><strong style=\"font-size:17px;font-weight:500;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums\">{{ rw.value }}<\u002Fstrong><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ res.hasTime }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:14px;line-height:1.5;color:#52675a\">{{ res.time }}<\u002Fp>\n          <\u002Fsc-if>\n          <a href=\"#first-month\" style=\"align-self:flex-start;margin-top:auto;display:inline-flex;align-items:center;gap:20px;border-radius:999px;background:#174c32;color:#f9fcf8;padding:15px 24px;min-height:50px;font-weight:500;line-height:1.2;transition:transform .18s\" style-hover=\"transform:translateY(-2px);color:#f9fcf8\">Посмотреть план запуска <span>↗<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #d8e1d6;padding:22px clamp(20px,2.5vw,32px);font-size:13px;color:#52675a;background:#f7f9f6\"><strong>Расчёт не является гарантией дохода.<\u002Fstrong> Исходные охваты, конверсии и средняя сумма являются учебными вводными, а не статистикой Nahrin. Дополнительные премии не включены. Результат зависит от фактических покупок и правил программы. <button sc-camel-on-click=\"{{ info.formula }}\" style=\"background:none;border:0;padding:0;margin-left:6px;cursor:pointer;font-size:13px;font-weight:500;color:#17392a\">Как устроен расчёт →<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"first-month\" style=\"padding:clamp(65px,8vw,94px) 0\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px 35px;margin-bottom:40px;flex-wrap:wrap\">\n      <div>\n        <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Первые 30 дней<\u002Fdiv>\n        <h2 style=\"font-size:clamp(34px,3.6vw,52px)\">Начните с одного<br>понятного шага.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:5px;background:#edf2eb;padding:5px;border:1px solid #d8e1d6;border-radius:16px\">\n        <sc-for list=\"{{ routeShort }}\" as=\"o\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;border-radius:11px;padding:12px 18px;font-size:14px;line-height:1.3;min-height:45px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:35px 26px\">\n      <sc-for list=\"{{ months }}\" as=\"wk\" hint-placeholder-count=\"4\">\n        <article style=\"border-top:1px solid #d8e1d6;padding-top:20px\">\n          <div style=\"color:#186b43;font-size:14px;margin-bottom:22px\">{{ wk.label }}<\u002Fdiv>\n          <h3 style=\"font-size:24px;letter-spacing:-.025em;line-height:1.15;min-height:58px;margin-bottom:17px\">{{ wk.h }}<\u002Fh3>\n          <p style=\"font-size:15px;color:#52675a\">{{ wk.p }}<\u002Fp>\n          <small style=\"font-size:13px;display:block;padding-top:17px\">{{ wk.end }}<\u002Fsmall>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin-top:30px;font-size:14px;line-height:1.5;color:#52675a\">Первый месяц помогает проверить процесс и собрать данные. План не устанавливает срок получения дохода. Учитывайте время на доставку и знакомство с продуктом.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"growth\" style=\"padding:clamp(65px,8vw,94px) 0;background:#edf2eb\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(35px,6vw,70px)\">\n    <div>\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Развитие партнёрства<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.2vw,40px)\">Больше опыта.<br>Больше возможностей.<\u002Fh2>\n      <p style=\"color:#52675a;margin-top:24px\">Начните с базовой экономики. К дополнительным условиям можно вернуться, когда вы поймёте свой формат работы.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:26px\">\n      <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr);gap:25px\"><h3 style=\"font-size:19px;letter-spacing:-.01em\">Рекомендую<\u002Fh3>
