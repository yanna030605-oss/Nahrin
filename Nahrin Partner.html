<p style=\"font-size:15px;color:#52675a;margin:0\">Изучаю продукт, создаю контент и направляю заинтересованных покупателей.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr);gap:25px\"><h3 style=\"font-size:19px;letter-spacing:-.01em\">Развиваю продажи<\u002Fh3><p style=\"font-size:15px;color:#52675a;margin:0\">Улучшаю форматы, анализирую результат и увеличиваю собственный объём продаж.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr);gap:25px\"><h3 style=\"font-size:19px;letter-spacing:-.01em\">Расширяю партнёрство<\u002Fh3><p style=\"font-size:15px;color:#52675a;margin:0\">При желании развиваю продажи с другими партнёрами. Для дополнительных премий действуют отдельные квалификации и условия.<\u002Fp><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ info.program }}\" style=\"justify-self:start;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px;font-weight:500\">Подробнее о премиях программы →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"terms\" style=\"padding:clamp(65px,8vw,94px) 0\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(40px,7vw,90px);align-items:start\">\n    <div style=\"position:sticky;top:120px\">\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">До подключения<\u002Fdiv>\n      <h2 style=\"font-size:clamp(34px,3.6vw,52px)\">Вопросы, которые<br>стоит прояснить.<\u002Fh2>\n      <p style=\"color:#52675a;margin-top:22px\">Посмотрите условия выбранного способа продаж. Полная программа и договор определяют требования, начисления и выплаты.<\u002Fp>\n      <a href=\"https://swissnahrinrus.ru/partnership/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px\">Программа на сайте Nahrin ↗<\u002Fa>\n    <\u002Fdiv>\n    <div>\n      <sc-for list=\"{{ terms }}\" as=\"tm\" hint-placeholder-count=\"9\">\n        <div style=\"border-bottom:1px solid #d8e1d6\">\n          <button sc-camel-on-click=\"{{ tm.toggle }}\" style=\"width:100%;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:17px;padding:24px 0;font-weight:500;text-align:left\">{{ tm.q }}<span style=\"font-size:26px;font-weight:400\">{{ tm.sign }}<\u002Fspan><\u002Fbutton>\n          <sc-if value=\"{{ tm.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"color:#52675a;padding:0 28px 25px 0;font-size:15px\">{{ tm.a }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"join\" style=\"padding:0 0 clamp(65px,8vw,94px)\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"background:#dbeacb;padding:clamp(27px,5vw,65px);border-radius:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(35px,5vw,70px);align-items:center\">\n      <div>\n        <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Ваш следующий шаг<\u002Fdiv>\n        <h2 style=\"font-size:clamp(34px,3.6vw,49px)\">Начните с продукта,<br>который вам близок.<\u002Fh2>\n      <\u002Fdiv>\n      <div>\n        <p style=\"color:#52675a;font-size:18px\">{{ r.join }}<\u002Fp>\n        <button sc-camel-on-click=\"{{ openJoin }}\" style=\"margin-top:10px;display:inline-flex;align-items:center;gap:20px;border:1px solid transparent;border-radius:999px;background:#174c32;color:#f9fcf8;padding:15px 24px;min-height:50px;font-weight:500;cursor:pointer;transition:transform .18s\" style-hover=\"transform:translateY(-2px)\">Перейти к подключению <span>↗<\u002Fspan><\u002Fbutton>\n        <p style=\"margin-top:19px;margin-bottom:0;font-size:14px\">Регистрация проходит на сайте Nahrin.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"padding:40px 0;border-top:1px solid #d8e1d6\">\n  <div style=\"width:min(1280px,calc(100% - 40px));margin:0 auto\">\n    <div style=\"display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap\">\n      <a href=\"#hero\" style=\"display:flex;align-items:center;gap:17px\">\n        <img src=\"ed0dfe88-02b7-4f9e-94c3-f4e836cd8f9d\" alt=\"Nahrin\" width=\"110\" height=\"45\" style=\"width:110px;height:45px;object-fit:contain\">\n        <span style=\"border-left:1px solid #d8e1d6;padding-left:17px;font-size:14px;line-height:1.25\">Партнёрская<br>программа<\u002Fspan>\n      <\u002Fa>\n      <div style=\"display:flex;gap:15px 25px;flex-wrap:wrap;font-size:14px;align-items:center\">\n        <button sc-camel-on-click=\"{{ info.sources }}\" style=\"background:none;border:0;padding:0;cursor:pointer;font-size:14px;font-weight:500;min-height:40px\">Источники<\u002Fbutton>\n        <a href=\"#calculator\" style=\"text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6\">Калькулятор<\u002Fa>\n        <a href=\"https://swissnahrinrus.ru/partnership/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6\">Условия Nahrin ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:27px 0 0;font-size:12px;max-width:860px;color:#52675a\">Презентационная версия партнёрской программы. Данные на этой странице не отправляются. Информация о продуктах и финансовые примеры не заменяют актуальную маркировку, договор и правила программы. Nahrin и названия торговых сетей принадлежат соответствующим правообладателям.<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ mOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;z-index:50;background:rgba(10,28,18,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;overflow:auto\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"position:relative;background:#fff;border:1px solid #d8e1d6;border-radius:24px;width:min({{ modalW }},100%);max-height:90vh;overflow:auto\">\n      <button sc-camel-on-click=\"{{ closeModal }}\" aria-label=\"Закрыть\" style=\"position:absolute;top:14px;right:14px;width:42px;height:42px;border:1px solid #d8e1d6;border-radius:50%;background:#f7f9f6;font-size:23px;display:grid;place-items:center;cursor:pointer\">×<\u002Fbutton>\n      <div style=\"padding:clamp(28px,5vw,42px)\">\n\n        <sc-if value=\"{{ mProduct }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">{{ prod.category }}<\u002Fdiv>\n          <h2 style=\"font-size:clamp(28px,3vw,34px);padding-right:30px;margin:10px 0 24px\">{{ prod.name }}<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:minmax(90px,160px) minmax(0,1fr);gap:clamp(18px,3vw,28px);align-items:center;margin-bottom:28px\">\n            <img src=\"{{ prod.img }}\" alt=\"{{ prod.name }}\" style=\"width:100%;max-height:230px;object-fit:contain;border-radius:16px;background:#fff\">\n            <div><p style=\"color:#52675a\">{{ prod.description }}<\u002Fp><p style=\"color:#52675a;font-size:14px;line-height:1.5\">{{ prod.idea }}<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ prod.hasPrice }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"color:#52675a\"><strong style=\"color:#17392a\">{{ prod.priceText }}<\u002Fstrong><br><span style=\"font-size:14px\">Публичная цена на дату подготовки. Перед покупкой проверьте актуальную цену и наличие на сайте.<\u002Fspan><\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ prod.noPrice }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"color:#52675a;font-size:14px\">Актуальная цена и наличие доступны в карточке продавца. Для расчёта можно ввести свою сумму заказа.<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:28px\">\n            <a href=\"{{ prod.url }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;border-radius:999px;padding:15px 24px;min-height:50px;font-weight:500;border:1px solid #d8e1d6\">Карточка продукта ↗<\u002Fa>\n            <button sc-camel-on-click=\"{{ prod.use }}\" style=\"display:inline-flex;align-items:center;border:1px solid transparent;border-radius:999px;background:#174c32;color:#f9fcf8;padding:15px 24px;min-height:50px;font-weight:500;cursor:pointer\">{{ prod.useLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ prod.isMinki }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:30px;border:1px solid #d8e1d6;padding:22px 24px;border-radius:16px;font-size:16px;color:#52675a\">БАД. Не является лекарственным средством.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mJoin }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">Подключение к программе<\u002Fdiv>\n          <h2 style=\"font-size:clamp(28px,3vw,34px);padding-right:30px;margin:10px 0 24px\">Ваш формат выбран.<\u002Fh2>\n          <div style=\"background:#edf2eb;border-radius:14px;padding:20px;margin:20px 0\">\n            <p style=\"margin:0;font-size:15px\"><strong>{{ join.route }}<\u002Fstrong><\u002Fp>\n            <p style=\"margin:0;font-size:15px\">{{ join.mode }}<\u002Fp>\n          <\u002Fdiv>\n          <ol style=\"padding-left:20px;color:#52675a;display:grid;gap:12px\">\n            <li>Изучите актуальную программу и договор.<\u002Fli>\n            <li>Уточните требования к выбранному способу продаж и выплатам.<\u002Fli>\n            <li>Пройдите регистрацию партнёра на официальном сайте.<\u002Fli>\n          <\u002Fol>\n          <p style=\"color:#52675a;font-size:14px\">На этой странице заявка не отправляется. Кнопка ниже откроет сайт Nahrin в новой вкладке.<\u002Fp>\n          <div style=\"display:flex;margin-top:28px\">\n            <a href=\"https://swissnahrinrus.ru/partnership/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;border-radius:999px;background:#174c32;color:#f9fcf8;padding:15px 24px;min-height:50px;font-weight:500\">Перейти на сайт Nahrin ↗<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mInfo }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#186b43;margin-bottom:19px\">{{ infoEyebrow }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ iResearch }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 style=\"font-size:clamp(30px,3.4vw,38px);max-width:590px;padding-right:30px;margin:10px 0 24px\">Исследования продукции Nahrin<\u002Fh2>\n          <p style=\"font-size:19px;line-height:1.55;color:#52675a\">Лабораторная оценка продуктов Nahrin по технологии «Литос-система».<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;background:#edf2eb;border:1px solid #d8e1d6;border-radius:16px;padding:24px;margin:24px 0 13px\">\n            <div><strong style=\"display:block;font-size:20px;font-weight:500;margin-bottom:8px\">В. Н. Шабалин<\u002Fstrong><span style=\"font-size:14px;color:#52675a;line-height:1.5\">Академик РАН, доктор медицинских наук, профессор<\u002Fspan><\u002Fdiv>\n            <div><strong style=\"display:block;font-size:20px;font-weight:500;margin-bottom:8px\">С. Н. Шатохина<\u002Fstrong><span style=\"font-size:14px;color:#52675a;line-height:1.5\">Доктор медицинских наук, профессор<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.5;color:#52675a\">Разработчики технологии «Литос-система», указанной в представленном протоколе.<\u002Fp>\n          <div style=\"display:grid;gap:16px;margin:28px 0\">\n            <article style=\"border:1px solid #d8e1d6;border-radius:16px;padding:clamp(21px,3vw,25px)\">\n              <div style=\"font-size:12px;color:#52675a;margin-bottom:13px\">Дополнительный протокол · 17 страниц<\u002Fdiv>\n              <h3 style=\"font-size:clamp(24px,2.4vw,26px);line-height:1.2;letter-spacing:-.025em;margin-bottom:13px\">Коэнзим Q10 и Осартен<\u002Fh3>\n              <p style=\"font-size:15px;line-height:1.6;color:#52675a\">Исследование OS ARTEN и ROTWEIN-Q10-KAPSELN. В документе представлены методика, микрофотографии образцов и заключения по каждому продукту.<\u002Fp>\n              <a href=\"documents/Nahrin-Osarten-Q10.pdf\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;border-radius:999px;background:#174c32;color:#f9fcf8;padding:13px 22px;min-height:48px;font-weight:500;font-size:14px;max-width:100%\">Открыть протокол Q10 и Осартен ↗<\u002Fa>\n            <\u002Farticle>\n            <article style=\"border:1px solid #d8e1d6;border-radius:16px;padding:clamp(21px,3vw,25px)\">\n              <div style=\"font-size:12px;color:#52675a;margin-bottom:13px\">Основной протокол · 54 страницы<\u002Fdiv>\n              <h3 style=\"font-size:clamp(24px,2.4vw,26px);line-height:1.2;letter-spacing:-.025em;margin-bottom:13px\">Артишок и другие продукты<\u002Fh3>\n              <p style=\"font-size:15px;line-height:1.6;color:#52675a\">Vivi Aloe, Mountain Jumper, Artischocken-Bitter, Лютеин, Фортивен и Basico tabs. Описание технологии, сравнительные изображения и выводы авторов.<\u002Fp>\n              <a href=\"documents/Nahrin-Litos.pdf\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;border-radius:999px;padding:13px 22px;min-height:48px;font-weight:500;font-size:14px;border:1px solid #d8e1d6;max-width:100%\">Открыть основной протокол ↗<\u002Fa>\n            <\u002Farticle>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #d8e1d6;padding-top:24px\">\n            <h3 style=\"font-size:20px;letter-spacing:-.015em;margin-bottom:14px\">Что исследовали<\u002Fh3>\n            <p style=\"font-size:14px;line-height:1.65;margin:0;color:#52675a\">В каждом из двух исследований использованы 10 образцов сыворотки крови. Продукты смешивали с образцами в лабораторных условиях, затем изучали структуру высушенных капель под микроскопом. Это лабораторные данные о взаимодействии образцов; клинические результаты приёма у людей требуют отдельной оценки.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ iReviews }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 style=\"font-size:clamp(28px,3vw,34px);padding-right:30px;margin:10px 0 24px\">Как проверить отзыв<\u002Fh2>\n          <ol style=\"padding-left:20px;color:#52675a;display:grid;gap:12px\">\n            <li>Убедитесь, что отзыв относится к нужному продукту и объёму упаковки.<\u002Fli>\n            <li>Посмотрите дату, продавца, общее количество и распределение оценок.<\u002Fli>\n            <li>Читайте разные мнения: о вкусе, текстуре, удобстве, упаковке и цене.<\u002Fli>\n            <li>Не переносите частный опыт на всех покупателей.<\u002Fli>\n          <\u002Fol>\n          <p style=\"color:#52675a\">Слова «покупаю повторно» описывают опыт одного человека. Они не доказывают долю повторных покупок бренда.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ iStarterKit }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 style=\"font-size:clamp(28px,3vw,34px);padding-right:30px;margin:10px 0 24px\">План подготовки первой публикации<\u002Fh2>\n          <ol style=\"padding-left:20px;color:#52675a;display:grid;gap:12px\">\n            <li>Выберите один продукт и изучите его маркировку.<\u002Fli>\n            <li>Запишите один вопрос вашей аудитории.<\u002Fli>\n            <li>Найдите подтверждённый факт, который помогает ответить.<\u002Fli>\n            <li>Подготовьте обзор, карусель или предметное видео. ИИ можно использовать для черновика.<\u002Fli>\n            <li>Проверьте текст, права на изображения и правила размещения.<\u002Fli>\n            <li>Подготовьте ссылку или процесс покупки у вас.<\u002Fli>\n            <li>После публикации сохраните данные о переходах и заказах.<\u002Fli>\n          <\u002Fol>\n          <p style=\"color:#52675a;font-size:14px;line-height:1.5\">Это пример рабочего плана. Доступные уроки и поддержку уточняйте в действующей программе Nahrin.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ iFormula }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 style=\"font-size:clamp(28px,3vw,34px);padding-right:30px;margin:10px 0 24px\">Из чего складывается расчёт<\u002Fh2>\n          <p style=\"color:#52675a\"><strong style=\"color:#17392a\">Контент:<\u002Fstrong> аудитория × охват одной публикации × число публикаций. Или аккаунты × публикации на аккаунт × просмотры публикации.<\u002Fp>\n          <p style=\"color:#52675a\"><strong style=\"color:#17392a\">Заказы:<\u002Fstrong> просмотры × доля переходов × конверсия × учитываемая доля заказов.<\u002Fp>\n          <p style=\"color:#52675a\"><strong style=\"color:#17392a\">По ссылке:<\u002Fstrong> учитываемые заказы × база заказа × 10,5%.<\u002Fp>\n          <p style=\"color:#52675a\"><strong style=\"color:#17392a\">Своим клиентам:<\u002Fstrong> учитываемые заказы × (розничная цена после скидки клиенту − 70% исходной розничной цены).<\u002Fp>\n          <p style=\"color:#52675a\">Обратный расчёт делит цель на результат одного заказа, затем вычисляет необходимые переходы, просмотры и публикации. Числа округляются вверх. Для цели после расходов введённые расходы и налоги сначала прибавляются к цели.<\u002Fp>\n          <p style=\"color:#52675a\">30% от розничной цены и около 43% от закупки описывают одну разницу. Они не складываются. Балльные и групповые премии сюда не включены.<\u002Fp>\n          <p style=\"color:#52675a;font-size:14px;line-height:1.5\">Параметры трафика учебные. При смешанном ассортименте и разных базах нужна детализация по заказам. Срок закрепления покупателя, корректировки и выплаты определяются действующими правилами.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ iProgram }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 style=\"font-size:clamp(28px,3vw,34px);padding-right:30px;margin:10px 0 24px\">Дополнительные премии программы<\u002Fh2>\n          <p style=\"color:#52675a\">Помимо базовой экономики, в маркетинговом плане предусмотрены персональные, групповые, лидерские и директорские премии.<\u002Fp>\n          <p style=\"color:#52675a\"><strong style=\"color:#17392a\">Персональная:<\u002Fstrong> от 5 до 20% по квалификации от личного балльного объёма. Это не тот же процент от розничной выручки.<\u002Fp>\n          <p style=\"color:#52675a\"><strong style=\"color:#17392a\">Групповая:<\u002Fstrong> зависит от продаж и статусов участников группы. Лидерские и директорские премии имеют дополнительные требования.<\u002Fp>\n          <p style=\"color:#52675a\"><strong style=\"color:#17392a\">Быстрый старт:<\u002Fstrong> отдельная программа на первые три месяца, с собственными условиями и ограниченной базой.<\u002Fp>\n          <p style=\"color:#52675a\">Для комиссионных брошюра указывает личный объём не менее 100 баллов. Применимость этого требования к интернет-бонусу, совмещение премий и актуальную редакцию правил уточните до подключения.<\u002Fp>\n          <a href=\"https://swissnahrinrus.ru/partnership/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;min-height:40px\">Открыть программу Nahrin ↗<\u002Fa>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ iSources }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 style=\"font-size:clamp(28px,3vw,34px);padding-right:30px;margin:10px 0 24px\">Источники и условия примеров<\u002Fh2>\n          <p style=\"color:#52675a\">Основа презентации: маркетинговая программа Nahrin с обложкой 2026 и материалы бренда. Проверка публичных сведений: 15 сентября 2026 года. В блок исследований добавлены два протокола, предоставленных для этой презентации.<\u002Fp>\n          <ul style=\"padding-left:20px;color:#52675a;display:grid;gap:4px\">\n            <li><a href=\"https://www.nahrin.ch/de/ueber-uns/international\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;color:#17392a\">Международная сеть Nahrin ↗<\u002Fa><\u002Fli>\n            <li><a href=\"https://www.nahrin.com/en/about-us\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;color:#17392a\">История бренда и логотип ↗<\u002Fa><\u002Fli>\n            <li><a href=\"https://www.nahrin.ch/de/allgemein/haeufige-fragen\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;color:#17392a\">Заявление о FSSC 22000 ↗<\u002Fa><\u002Fli>\n            <li><a href=\"https://swissnahrinrus.ru/partnership/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;color:#17392a\">Интернет-бонус и партнёрство ↗<\u002Fa><\u002Fli>\n            <li><a href=\"https://swissnahrinrus.ru/about-us/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"text-decoration:underline;text-underline-offset:5px;text-decoration-color:#d8e1d6;color:#17392a\">Фотографии и происхождение продукции ↗<\u002Fa><\u002Fli>\n          <\u002Ful>\n          <p style=\"color:#52675a\">Ссылки на ритейлеров находятся в блоке присутствия бренда, на продукты в их карточках. Изображения взяты с сайтов Nahrin для этой презентации; права принадлежат правообладателям.<\u002Fp>\n          <p style=\"color:#52675a\">Калькулятор использует учебные охваты, конверсии и суммы. Гарантии дохода, вымышленные рейтинги и финансовые кейсы не используются. Точные условия подключения, начисления и выплаты определяются действующим договором.<\u002Fp>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY = 'nahrin-partner-local-v1';\nconst C = { bg:'#f7f9f6', tint:'#edf2eb', ink:'#17392a', muted:'#52675a', line:'#d8e1d6', accent:'#186b43', button:'#174c32', on:'#f9fcf8', soft:'#dbeacb' };\nconst DEF = { followers:'20000', reach:'25', audiencePosts:'20', accounts:'1', starterPosts:'20', postViews:'5000', goal:'250000', goalKind:'gross', reverseViews:'5000', ctr:'1', conversion:'2', price:'5000', accounted:'90', clientDiscount:'0', expenses:'0', taxes:'0', hoursDay:'4', workDays:'20', minutesPost:'30', otherHours:'10', targetAccounts:'10' };\nconst F = { followers:[0,100000000,100,'Размер аудитории'], reach:[0,100,1,'Охват публикации, %'], audiencePosts:[0,10000,1,'Публикаций за месяц'], accounts:[0,1000,1,'Число аккаунтов'], starterPosts:[0,10000,1,'Публикаций на аккаунт'], postViews:[0,100000000,100,'Просмотров публикации'], goal:[0,100000000,1000,'Цель за месяц, ₽'], reverseViews:[0,100000000,100,'Просмотров одной публикации'], ctr:[0,100,0.1,'Доля переходов, %'], conversion:[0,100,0.1,'Конверсия в заказ, %'], price:[0,10000000,100,'База одного заказа, ₽'], accounted:[0,100,1,'Учитываемые заказы, %'], clientDiscount:[0,100,1,'Ск lse,reviews:false}, terms:{0:true}, expOpen:false, modal:null, retailPos:'1 / 8', prevDis:true, nextDis:false };\n    try { const x = JSON.parse(localStorage.getItem(KEY)||'null'); if (x) {\n      if (['audience','starter'].includes(x.route)) s.route = x.route;\n      if (['link','retail'].includes(x.mode)) s.mode = x.mode;\n      if (['forward','reverse'].includes(x.calc)) s.calc = x.calc;\n      if (['review','faceless','expert'].includes(x.example)) s.example = x.example;\n      if (x.inputs) for (const k in DEF) if (Object.prototype.hasOwnProperty.call(x.inputs,k)) s.inp[k] = String(x.inputs[k]);\n    } } catch (e) {}\n    return s;\n  })();\n  componentDidMount() {\n    this.onKey = e => { if (e.key === 'Escape' && this.state.modal) this.setState({modal:null}); };\n    document.addEventListener('keydown', this.onKey);\n    this.ro = new ResizeObserver(() => this.updateRetail());\n    if (this.trackRef.current) this.ro.observe(this.trackRef.current);\n    this.updateRetail();\n  }\n  componentWillUnmount() { document.removeEventListener('keydown', this.onKey); this.ro && this.ro.disconnect(); }\n  componentDidUpdate() {\n    const s = this.state;\n    try { localStorage.setItem(KEY, JSON.stringify({route:s.route,mode:s.mode,calc:s.calc,example:s.example,inputs:s.inp})); } catch (e) {}\n    document.body.style.overflow = s.modal ? 'hidden' : '';\n  }\n  updateRetail() {\n    const t = this.trackRef.current; if (!t) return;\n    const cards = [...t.children].filter(c => c.tagName === 'A'); if (!cards.length) return;\n    const max = t.scrollWidth - t.clientWidth, left = t.scrollLeft, rect = t.getBoundingClientRect();\n    const shown = cards.map((c,i) => ({i:i+1, r:c.getBoundingClientRect()})).filter(c => c.r.left < rect.right-8 && c.r.right > rect.left+8);\n    const pos = shown.length ? shown[0].i + '…' + shown[shown.length-1].i + ' / ' + cards.length : '1 / ' + cards.length;\n    const prevDis = left <= 2, nextDis = left >= max-2;\n    if (pos !== this.state.re gross = orders*unit, net = gross-expenses-taxes;\n        out.label = 'Для цели ' + money(goal) + ' потребуется примерно';\n        out.main = number(orders) + ' заказов';\n        out.expl = 'Учитываемые заказы округлены вверх. Объём трафика рассчитан по вашим коэффициентам и не гарантирует достижение цели.';\n        out.flow = [[number(views),'просмотров / контактов'],[number(clicks),'переходов'],[number(posts),'публикаций за месяц'],[number(Math.ceil(posts/accounts)),'публикаций на аккаунт, до']].map(([v,l]) => ({v,l}));\n        out.rows = (link ? [row('База учитываемых заказов', money(orders*price))] : [row('Выручка после скидки', money(orders*sale)), row('Закупка проданного товара', money(orders*cost))]).concat([row(link ? 'Начисление до расходов' : 'Разница до прочих расходов', money(gross)), row('Расходы и налоги', money(expenses+taxes)), row('После указанных расходов', money(net), true)]);\n        const available = hours*days, needed = posts*minutes/60 + otherHours, diff = needed - available;\n        out.time = 'Время: нужно около ' + number(needed) + ' ч, доступно ' + number(available) + ' ч. ' + (diff > 0 ? 'Не хватает ' + number(diff) + ' ч. Измените объём, время на материал или цель.' : 'По введённым оценкам остаётся ' + number(-diff) + ' ч. Это проверка нагрузки, а не обещание охватов.') + ' На один аккаунт в плане приходится около ' + number(posts/accounts) + ' публикаций.';\n        out.hasTime = true;\n      }\n    } catch (e) {\n      out.main = 'Нет расчёта'; out.label = 'Проверьте исходные данные'; out.expl = 'Результат появится после исправления параметров.'; out.error = e.message; out.hasError = true; out.flow = []; out.rows = []; out.hasTime = false;\n    }\n    return out;\n  }\n  renderVals() {\n    const s = this.state, link = s.mode === 'link', r0 = ROUTE[s.route], r = {...r0, roles: r0.roles.map(([h,p]) => ({h,p}))};\n    const seg = (list, cur, key) => list.map(([val,label]) => ({label, bg: cur === val ? C.button : 'transparent', fg:
